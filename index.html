<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#072E22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Warisan Ilmu</title>
<link rel="manifest" href="manifest.json">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
  body { background:#072E22; color:white; overflow:hidden; }
  .page { width:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
  #halaman-utama { display:none; overflow-y:auto; justify-content:flex-start; padding-top:32px; }
  .logo { font-size:64px; margin-bottom:16px; }
  h1 { font-size:32px; margin-bottom:8px; }
  p { opacity:0.8; line-height:1.6; margin-bottom:24px; }
  .btn-masuk {
    width:100%; max-width:320px; padding:16px; font-size:19px; font-weight:bold;
    background:#E9C46A; color:#072E22; border:none; border-radius:14px; cursor:pointer;
  }
  .btn-masuk:active { transform:scale(0.97); }
  .card { width:100%; max-width:420px; background:white; color:#222; border-radius:16px; padding:18px; text-align:left; margin-bottom:14px; }
  .card h3 { margin-bottom:6px; }
  .card p { color:#555; margin:0; font-size:14px; }
  .btn-kecil { margin-top:16px; background:transparent; border:1px solid rgba(255,255,255,0.4); color:white; padding:10px 18px; border-radius:10px; }
</style>
</head>
<body>

<!-- HALAMAN 1: MASUK -->
<div id="halaman-masuk" class="page">
  <div class="logo">📚</div>
  <h1>Warisan Ilmu</h1>
  <p>Belajar warisan ilmu leluhur.<br>Klik Masuk untuk mulai.</p>
  <button class="btn-masuk" onclick="masuk()">MASUK</button>
  <p style="font-size:12px; margin-top:18px;">v1.0 - Tap Masuk untuk Full Screen</p>
</div>

<!-- HALAMAN 2: HALAMAN UTAMA -->
<div id="halaman-utama" class="page">
  <h1 style="margin-bottom:20px;">Halaman Utama</h1>
  <div class="card"><h3>📖 Materi 1</h3><p>Isi materi pertama kamu di sini.</p></div>
  <div class="card"><h3>📖 Materi 2</h3><p>Isi materi kedua kamu di sini.</p></div>
  <div class="card"><h3>📖 Materi 3</h3><p>Isi materi ketiga kamu di sini.</p></div>
  <button class="btn-kecil" onclick="keluarFullscreen()">Keluar Full Screen</button>
</div>

<script>
function masuk() {
  // 1. Minta Full Screen dulu - ini kuncinya
  var el = document.documentElement;
  if (el.requestFullscreen) {
    el.requestFullscreen().catch(function(){});
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  } else if (el.msRequestFullscreen) {
    el.msRequestFullscreen();
  }

  // 2. Ganti tampilan tanpa pindah halaman, biar full screen tidak hilang
  document.getElementById('halaman-masuk').style.display = 'none';
  var utama = document.getElementById('halaman-utama');
  utama.style.display = 'flex';
  document.body.style.overflow = 'auto';

  // 3. Paksa full screen lagi setelah 300ms, buat jaga-jaga kalau ditolak pertama
  setTimeout(function(){
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
    }
  }, 300);
}

function keluarFullscreen() {
  if (document.exitFullscreen) document.exitFullscreen();
}

if ('serviceWorker' in navigator) {
  // tidak pakai service worker biar tidak ribet
}
</script>
</body>
</html>
